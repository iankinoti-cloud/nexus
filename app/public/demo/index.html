<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Demo Walkthrough</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: #6366f1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #f1f5f9;
    }

    h1 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #64748b;
      font-size: 15px;
      text-align: center;
      margin-bottom: 32px;
    }

    .video-wrapper {
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(99,102,241,0.2);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .cta {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn:hover { opacity: 0.82; }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 36px;
    }

    .pill {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark">✦</div>
    <span class="logo-text">NEXUS</span>
  </div>

  <h1>AI Operating System for Creative Agencies</h1>
  <p class="subtitle">micro1 Agentic Workflows Hackathon · 2026</p>

  <div class="video-wrapper">
    <video controls autoplay muted loop playsinline>
      <source src="nexus_demo.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="cta">
    <a href="https://nexus-topaz-omega.vercel.app" class="btn btn-primary" target="_blank">
      Try NEXUS Live →
    </a>
    <a href="https://github.com/iankinoti-cloud" class="btn btn-secondary" target="_blank">
      View Source
    </a>
  </div>

  <div class="pill-row">
    <span class="pill">Agentic AI</span>
    <span class="pill">Claude claude-opus-4-8</span>
    <span class="pill">Project Intelligence</span>
    <span class="pill">Team Capacity</span>
    <span class="pill">RFP Scanner</span>
    <span class="pill">Growth Pipeline</span>
    <span class="pill">Real-time Analytics</span>
  </div>
</body>
</html>
